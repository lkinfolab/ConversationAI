{% extends "base.html" %}
{% block title %}Profile – ConversationAI{% endblock %}
{% block page_title %}My Profile{% endblock %}

{% block content %}
<div class="row g-4">

  <!-- Profile Card -->
  <div class="col-md-4">
    <div class="card text-center">
      <div class="card-body p-4">
        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center fw-bold text-white"
             id="avatar-circle" style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);font-size:2rem">
          U
        </div>
        <h5 class="fw-bold mb-1" id="profile-name">Loading…</h5>
        <p class="text-muted mb-1" id="profile-email"></p>
        <div id="profile-role-badge"></div>
        <hr>
        <div class="text-start">
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted small">Department</span>
            <span class="small fw-semibold" id="profile-dept">–</span>
          </div>
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted small">Phone</span>
            <span class="small fw-semibold" id="profile-phone">–</span>
          </div>
          <div class="d-flex justify-content-between">
            <span class="text-muted small">Member since</span>
            <span class="small fw-semibold" id="profile-since">–</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Tabs -->
  <div class="col-md-8">
    <div class="card">
      <div class="card-header p-0 border-0">
        <ul class="nav nav-tabs border-0 px-3 pt-2">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-info">
            <i class="bi bi-person me-1"></i>Profile Info
          </button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-password">
            <i class="bi bi-key me-1"></i>Change Password
          </button></li>
        </ul>
      </div>

      <div class="card-body tab-content">

        <!-- Profile Info Tab -->
        <div class="tab-pane fade show active" id="tab-info">
          <form id="profile-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">First Name</label>
                <input type="text" class="form-control" id="pf-first_name" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Last Name</label>
                <input type="text" class="form-control" id="pf-last_name" />
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control" id="pf-email" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Phone</label>
                <input type="text" class="form-control" id="pf-phone" placeholder="+1 555 000 0000" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Department</label>
                <input type="text" class="form-control" id="pf-department" placeholder="Engineering" />
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Bio</label>
                <textarea class="form-control" id="pf-bio" rows="3" placeholder="Tell us about yourself…"></textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary" id="save-profile-btn">
                  <i class="bi bi-save me-1"></i>Save Changes
                </button>
              </div>
            </div>
          </form>
        </div><!-- /tab-info -->

        <!-- Change Password Tab -->
        <div class="tab-pane fade" id="tab-password">
          <form id="password-form">
            <div class="mb-3">
              <label class="form-label fw-semibold">Current Password</label>
              <input type="password" class="form-control" id="old-password" required />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">New Password</label>
              <input type="password" class="form-control" id="new-password" required minlength="8" />
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Confirm New Password</label>
              <input type="password" class="form-control" id="confirm-password" required />
            </div>
            <button type="submit" class="btn btn-warning" id="change-pw-btn">
              <i class="bi bi-key me-1"></i>Update Password
            </button>
          </form>
        </div><!-- /tab-password -->

      </div>
    </div>
  </div>

</div>
{% endblock %}

{% block extra_scripts %}
<script>
requireAuth();

async function loadProfile() {
    try {
        const user = await UserAPI.getProfile();

        // Sidebar display
        const name = `${user.first_name || ''} ${user.last_name || ''}`.trim() || user.email;
        document.getElementById('profile-name').textContent = name;
        document.getElementById('profile-email').textContent = user.email;
        document.getElementById('profile-role-badge').innerHTML = roleBadge(user.role);
        document.getElementById('avatar-circle').textContent = (user.first_name?.[0] || user.email?.[0] || 'U').toUpperCase();
        document.getElementById('profile-dept').textContent = user.profile?.department || '–';
        document.getElementById('profile-phone').textContent = user.profile?.phone || '–';
        document.getElementById('profile-since').textContent = user.date_joined
            ? new Date(user.date_joined).toLocaleDateString('en-US', {dateStyle:'medium'})
            : '–';

        // Form fields
        document.getElementById('pf-first_name').value  = user.first_name || '';
        document.getElementById('pf-last_name').value   = user.last_name || '';
        document.getElementById('pf-email').value       = user.email || '';
        document.getElementById('pf-phone').value       = user.profile?.phone || '';
        document.getElementById('pf-department').value  = user.profile?.department || '';
        document.getElementById('pf-bio').value         = user.profile?.bio || '';

    } catch (err) {
        showToast('Failed to load profile', 'danger');
    }
}

document.getElementById('profile-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('save-profile-btn');
    setLoading(btn, true, 'Saving…');

    try {
        await UserAPI.updateProfile({
            first_name: document.getElementById('pf-first_name').value.trim(),
            last_name:  document.getElementById('pf-last_name').value.trim(),
            email:      document.getElementById('pf-email').value.trim(),
            profile: {
                phone:      document.getElementById('pf-phone').value.trim(),
                department: document.getElementById('pf-department').value.trim(),
                bio:        document.getElementById('pf-bio').value.trim(),
            },
        });

        showToast('Profile updated successfully!', 'success');
        // Refresh stored user
        const user = await UserAPI.getProfile();
        Auth.setAuth(Auth.getToken(), Auth.getRefresh(), user);
        await loadProfile();

    } catch (err) {
        showToast(err.message || 'Failed to update profile', 'danger');
    } finally {
        setLoading(btn, false);
    }
});

document.getElementById('password-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const newPw  = document.getElementById('new-password').value;
    const confPw = document.getElementById('confirm-password').value;

    if (newPw !== confPw) { showToast('Passwords do not match', 'danger'); return; }

    const btn = document.getElementById('change-pw-btn');
    setLoading(btn, true, 'Updating…');

    try {
        await UserAPI.changePassword({
            old_password:     document.getElementById('old-password').value,
            new_password:     newPw,
            confirm_password: confPw,
        });
        showToast('Password changed successfully!', 'success');
        this.reset();
    } catch (err) {
        showToast(err.message || 'Failed to change password', 'danger');
    } finally {
        setLoading(btn, false);
    }
});

loadProfile();
</script>
{% endblock %}
