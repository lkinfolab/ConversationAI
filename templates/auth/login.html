{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login – ConversationAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<div id="toast-container"></div>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🤖</div>
    <h2>Welcome back</h2>
    <p class="auth-subtitle">Sign in to ConversationAI</p>

    <form id="login-form">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required />
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="••••••••" required />
          <button class="btn btn-outline-secondary" type="button" id="toggle-password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2" id="login-btn">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <hr class="my-3" />
    <p class="text-center text-muted mb-0" style="font-size:.9rem">
      Don't have an account?
      <a href="/register/" class="text-decoration-none fw-semibold" style="color:#4f46e5">Register</a>
    </p>

    <!-- Demo credentials hint -->
    <div class="alert alert-light border mt-3 mb-0" style="font-size:.8rem">
      <strong>Demo:</strong><br>
      Admin: <code>admin@conversationai.com</code> / <code>admin123</code>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/api.js' %}"></script>
<script>
redirectIfLoggedIn();   // if already logged in, skip to dashboard

// Password toggle
document.getElementById('toggle-password').addEventListener('click', function () {
    const inp = document.getElementById('password');
    const icon = this.querySelector('i');
    if (inp.type === 'password') { inp.type = 'text'; icon.className = 'bi bi-eye-slash'; }
    else { inp.type = 'password'; icon.className = 'bi bi-eye'; }
});

// Login form submit
document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    setLoading(btn, true, 'Signing in…');

    try {
        const data = await AuthAPI.login(
            document.getElementById('email').value.trim(),
            document.getElementById('password').value
        );

        showToast(`Welcome back, ${data.user.first_name || data.user.email}!`, 'success');

        // Role-based redirect
        setTimeout(() => {
            const role = data.user.role;
            if      (role === 'admin')      window.location.href = '/admin-panel/';
            else if (role === 'moderator')  window.location.href = '/moderator/';
            else                            window.location.href = '/dashboard/';
        }, 800);

    } catch (err) {
        showToast(err.message || 'Login failed. Please check your credentials.', 'danger');
        setLoading(btn, false);
    }
});
</script>
</body>
</html>
