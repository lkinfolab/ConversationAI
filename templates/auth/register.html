{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Register – ConversationAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<div id="toast-container"></div>

<div class="auth-page">
  <div class="auth-card" style="max-width:480px">
    <div class="auth-logo">✨</div>
    <h2>Create account</h2>
    <p class="auth-subtitle">Join ConversationAI today</p>

    <form id="register-form">
      <div class="row g-3 mb-3">
        <div class="col-6">
          <label class="form-label fw-semibold">First Name</label>
          <input type="text" class="form-control" id="first_name" placeholder="John" required />
        </div>
        <div class="col-6">
          <label class="form-label fw-semibold">Last Name</label>
          <input type="text" class="form-control" id="last_name" placeholder="Doe" required />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-at"></i></span>
          <input type="text" class="form-control" id="username" placeholder="johndoe" required />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Email address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="email" placeholder="john@example.com" required />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="••••••••" required minlength="8" />
        </div>
        <div class="form-text">Minimum 8 characters</div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" class="form-control" id="password_confirm" placeholder="••••••••" required />
        </div>
      </div>

      <!-- Password strength indicator -->
      <div class="mb-3">
        <div class="d-flex gap-1" id="strength-bars">
          <div class="flex-fill rounded" style="height:4px;background:#e5e7eb" id="s1"></div>
          <div class="flex-fill rounded" style="height:4px;background:#e5e7eb" id="s2"></div>
          <div class="flex-fill rounded" style="height:4px;background:#e5e7eb" id="s3"></div>
          <div class="flex-fill rounded" style="height:4px;background:#e5e7eb" id="s4"></div>
        </div>
        <div class="form-text" id="strength-label"></div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2" id="register-btn">
        <i class="bi bi-person-plus me-2"></i>Create Account
      </button>
    </form>

    <hr class="my-3" />
    <p class="text-center text-muted mb-0" style="font-size:.9rem">
      Already have an account?
      <a href="/login/" class="text-decoration-none fw-semibold" style="color:#4f46e5">Sign in</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/api.js' %}"></script>
<script>
redirectIfLoggedIn();

// Password strength
document.getElementById('password').addEventListener('input', function () {
    const pw = this.value;
    const strength = [
        pw.length >= 8,
        /[A-Z]/.test(pw),
        /[0-9]/.test(pw),
        /[^a-zA-Z0-9]/.test(pw),
    ];
    const score = strength.filter(Boolean).length;
    const colors = ['#ef4444','#f59e0b','#10b981','#10b981'];
    const labels = ['','Weak','Fair','Good','Strong'];
    for (let i=1;i<=4;i++) {
        document.getElementById('s'+i).style.background = i<=score ? colors[score-1] : '#e5e7eb';
    }
    document.getElementById('strength-label').textContent = pw.length > 0 ? labels[score] : '';
});

// Register form
document.getElementById('register-form').addEventListener('submit', async function (e) {
    e.preventDefault();

    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('password_confirm').value;

    if (password !== confirm) {
        showToast('Passwords do not match', 'danger');
        return;
    }

    const btn = document.getElementById('register-btn');
    setLoading(btn, true, 'Creating account…');

    try {
        await AuthAPI.register({
            first_name:       document.getElementById('first_name').value.trim(),
            last_name:        document.getElementById('last_name').value.trim(),
            username:         document.getElementById('username').value.trim(),
            email:            document.getElementById('email').value.trim(),
            password:         password,
            password_confirm: confirm,
        });

        showToast('Account created! Redirecting to login…', 'success');
        setTimeout(() => window.location.href = '/login/', 1500);

    } catch (err) {
        showToast(err.message || 'Registration failed', 'danger');
        setLoading(btn, false);
    }
});
</script>
</body>
</html>
