{% extends 'base.html' %}

{% block title %}Error – ConversationAI{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 3rem;">
  <div style="font-size: 4rem; margin-bottom: 1rem;">⚠️</div>
  <h2 style="color: #e74c3c; margin-bottom: 1rem;">Access Denied</h2>
  <p style="color: #666; margin-bottom: 2rem; font-size: 1.1rem;">{{ error }}</p>
  <a href="{% url 'frontend:user_dashboard' %}" class="btn btn-primary">
    <i class="bi bi-arrow-left me-2"></i>Go Back
  </a>
</div>
{% endblock %}
